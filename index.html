<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F6BFF">
<title>作业工作台 · 托管学生作业管理</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   设计体系
   ============================================================ */
:root{
  --bg:#F3F6FC;
  --surface:#FFFFFF;
  --surface-2:#EAF1FF;
  --surface-3:#F7F9FE;
  --ink:#1B2430;
  --ink-2:#5A6572;
  --ink-3:#8A94A3;
  --line:#E3EAF5;
  --primary:#2F6BFF;
  --primary-strong:#1E55E0;
  --primary-soft:#E9F0FF;
  --accent:#FF8A3D;
  --accent-soft:#FFF1E6;
  --success:#18A05E;
  --success-soft:#E5F7EE;
  --warn:#E5A50A;
  --warn-soft:#FDF3D9;
  --danger:#E5484D;
  --danger-soft:#FDEAEA;
  --radius:16px;
  --radius-s:12px;
  --shadow:0 1px 2px rgba(16,32,60,.05),0 10px 28px rgba(16,32,60,.08);
  --shadow-s:0 1px 2px rgba(16,32,60,.06);
  --sidebar-w:232px;
  --rail-w:76px;
  --font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line);border-radius:var(--radius-s);padding:11px 13px;background:#fff;width:100%;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,107,255,.14)}
textarea{resize:vertical;min-height:78px}
label{font-size:13px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CBD6EA;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.main{min-width:0;padding:22px clamp(16px,4vw,40px) 40px;max-width:1180px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-title h1{font-size:22px;font-weight:800;letter-spacing:.2px}
.page-title .sub{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* ============ 侧边栏 ============ */
.sidebar{
  position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,#ffffff,#f6f9ff);
  border-right:1px solid var(--line);
  padding:20px 14px 18px;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand-logo{width:54px;height:54px;border-radius:50%;flex:none;object-fit:cover;box-shadow:0 4px 12px rgba(47,107,255,.25);border:2px solid #fff}
.brand-name{font-size:14.5px;font-weight:800;line-height:1.3;color:var(--ink);letter-spacing:.2px}
.brand-name small{display:block;font-size:10.5px;font-weight:600;color:var(--primary);margin-top:2px;letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-group{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:1.2px;padding:16px 13px 5px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:12px;
  color:var(--ink-2);font-weight:600;font-size:14.5px;transition:background .15s,color .15s;text-align:left;width:100%;
}
.nav-item .nav-ic{
  width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);transition:all .18s;overflow:hidden;
}
.nav-item .nav-ic svg{width:18px;height:18px}
.nav-item .nav-ic img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.nav-item:hover{background:var(--surface-2);color:var(--primary)}
.nav-item:hover .nav-ic{background:var(--primary-soft);color:var(--primary);transform:scale(1.06)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(47,107,255,.3)}
.nav-item.active .nav-ic{background:rgba(255,255,255,.22);color:#fff}
.sidebar-foot{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sidebar-foot .nav-item{font-size:13px}

/* ============ 手机端抽屉导航 ============ */
.menu-toggle{
  display:none;position:fixed;top:12px;left:12px;z-index:70;
  width:44px;height:44px;border-radius:13px;
  background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.18);
  align-items:center;justify-content:center;cursor:pointer;
  border:1.5px solid var(--line);
}
.menu-toggle svg{width:22px;height:22px;color:var(--ink-1)}
.menu-toggle:active{transform:scale(.94)}
.sidebar-backdrop{
  display:none;position:fixed;inset:0;background:rgba(18,28,52,.38);
  z-index:55;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}

/* ============ 卡片 ============ */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid rgba(227,234,245,.7)}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-head h3{font-size:15.5px;font-weight:700}
.card-head .hint{font-size:12.5px;color:var(--ink-3)}

/* ============ 统计卡片 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{
  background:var(--surface);border-radius:var(--radius);padding:16px 16px 14px;
  box-shadow:var(--shadow);border:1px solid rgba(227,234,245,.7);position:relative;overflow:hidden;
}
.stat .num{font-size:30px;font-weight:800;letter-spacing:.3px}
.stat .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.stat .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.stat .ic svg{width:20px;height:20px}
.ic-blue{background:linear-gradient(135deg,#3D78FF,#5C8CFF)}
.ic-green{background:linear-gradient(135deg,#20B571,#38D08B)}
.ic-orange{background:linear-gradient(135deg,#FF9445,#FFB26B)}
.ic-purple{background:linear-gradient(135deg,#7C5CF0,#9A80F5)}

/* ============ 学生卡片 ============ */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
.student-card{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid rgba(227,234,245,.7);padding:16px;cursor:pointer;
  transition:transform .16s,box-shadow .16s;position:relative;
}
.student-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,32,60,.12)}
.student-top{display:flex;align-items:center;gap:12px}
.avatar{
  width:48px;height:48px;border-radius:14px;flex:none;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
}
.student-meta{min-width:0}
.student-meta .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.student-meta .cls{font-size:12.5px;color:var(--ink-2)}
.student-stat{display:flex;align-items:center;gap:14px;margin-top:14px}
.ring-wrap{position:relative;width:64px;height:64px;flex:none}
.ring-wrap .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-wrap .ring-txt b{font-size:15px;font-weight:800}
.ring-wrap .ring-txt span{font-size:9.5px;color:var(--ink-3);font-weight:600}
.student-bars{flex:1;display:flex;flex-direction:column;gap:7px}
.mini-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.mini-bar .bar{flex:1;height:7px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.mini-bar .bar i{display:block;height:100%;border-radius:6px;background:var(--primary)}
.mini-bar .bar i.green{background:var(--success)}
.mini-bar .bar i.orange{background:var(--accent)}
.student-foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-2)}
.student-foot .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.card-del{margin-left:auto;width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex:none}
.card-del svg{width:15px;height:15px}
.card-del:hover{background:var(--danger-soft);color:var(--danger);transform:scale(1.1)}

/* ============ 待办/作业列表 ============ */
.todo-list{display:flex;flex-direction:column;gap:10px}
.todo-item{
  display:flex;align-items:center;gap:12px;background:var(--surface-3);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:background .15s,border-color .15s;
}
.todo-item.done{background:var(--success-soft);border-color:#c9ecdb}
.check-btn{
  width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  border:2.5px solid #C7D3EA;color:#C7D3EA;background:#fff;transition:all .18s;
}
.check-btn svg{width:24px;height:24px}
.check-btn:hover{border-color:var(--success);color:var(--success)}
.todo-item.done .check-btn{border-color:var(--success);background:var(--success);color:#fff;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.todo-main{flex:1;min-width:0}
.todo-main .tm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo-main .ct{font-weight:600;font-size:14.5px;margin-top:2px;word-break:break-word}
.todo-main .meta{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.todo-ops{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{
  width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:all .15s;
}
.icon-btn svg{width:19px;height:19px}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.photo-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;flex:none}

/* ============ 科目标签 ============ */
.sub{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.sub .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sub-yuwen{background:#FDE8DE;color:#D9490B}
.sub-shuxue{background:#E9F0FF;color:#1E55E0}
.sub-yingyu{background:#E0F5EC;color:#0B8A56}
.sub-kexue{background:#EFE9FD;color:#6B45D6}
.sub-other{background:#EEF1F5;color:#5A6572}

/* ============ 周报表格 ============ */
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(227,234,245,.7);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{background:var(--surface-2);color:var(--ink-2);font-weight:700;text-align:left;padding:12px 14px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-3)}
.progress-cell{display:flex;align-items:center;gap:10px;min-width:150px}
.progress-cell .bar{flex:1;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.progress-cell .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3D78FF,#5C8CFF)}
.rate-badge{font-weight:800;font-size:14px;white-space:nowrap}

/* ============ 报告 ============ */
.report{max-width:820px;margin:0 auto}
.report-head{
  background:linear-gradient(135deg,#2F6BFF,#5C8CFF);color:#fff;border-radius:20px;padding:26px 26px 22px;
  box-shadow:0 16px 34px rgba(47,107,255,.3);position:relative;overflow:hidden;
}
.report-head::after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12)}
.report-head::before{content:"";position:absolute;right:60px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.report-head .rh-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.report-head h1{font-size:24px;font-weight:800;letter-spacing:.5px}
.report-head .rh-sub{font-size:13px;opacity:.9;margin-top:4px}
.grade-badge{margin-left:auto;text-align:center;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.45);border-radius:16px;padding:8px 18px;backdrop-filter:blur(4px)}
.grade-badge b{display:block;font-size:34px;font-weight:800;line-height:1}
.grade-badge span{font-size:11px;opacity:.9}
.report-section{background:#fff;border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(227,234,245,.7);padding:20px;margin-top:16px}
.report-section h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.report-section h3 .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.report-section h3 .ico svg{width:16px;height:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv-item{background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kv-item .k{font-size:12px;color:var(--ink-3);font-weight:600}
.kv-item .v{font-size:19px;font-weight:800;margin-top:2px}
.subject-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.subject-row:last-child{border-bottom:none}
.subject-row .sub{width:64px;justify-content:center}
.subject-row .bar{flex:1;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.subject-row .bar i{display:block;height:100%;border-radius:6px}
.subject-row .val{width:86px;text-align:right;font-size:12.5px;color:var(--ink-2);font-weight:600}
.point-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;margin:4px 6px 0 0}
.mastery-dots{display:inline-flex;gap:3px}
.mastery-dots svg{width:15px;height:15px}
.advice{display:flex;gap:12px;padding:12px;background:var(--surface-3);border-radius:12px;border-left:4px solid var(--accent);margin-top:10px}
.advice svg{width:20px;height:20px;color:var(--accent);flex:none;margin-top:2px}
.report-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;transition:all .15s;justify-content:center}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.3)}
.btn-primary:hover{background:var(--primary-strong)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-green{background:var(--success);color:#fff;box-shadow:0 6px 16px rgba(24,160,94,.28)}
.btn-green:hover{background:#148a51}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1.5px solid #f5c6c7}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn-block{width:100%}

/* ============ 空状态 ============ */
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty svg{width:64px;height:64px;color:#C7D3EA;margin-bottom:12px}
.empty b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:4px}
.empty p{font-size:13px;max-width:340px;margin:0 auto}

/* ============ 弹窗 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(20,32,58,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.modal-mask.open{display:flex}
.modal{
  background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:22px 20px 20px;animation:slideUp .26s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:560px){
  .modal-mask{align-items:center}
  .modal{border-radius:20px;box-shadow:var(--shadow)}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:17px;font-weight:800}
.modal-close{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--ink-2)}
.modal-close svg{width:18px;height:18px}
.form-row{margin-bottom:14px}
.form-row .inline{display:flex;gap:10px}
.form-row .inline>*{flex:1}
.hint-line{font-size:12px;color:var(--ink-3);margin-top:6px}

/* ============ 星星评分 ============ */
.star-input{display:inline-flex;gap:4px;padding:8px 0}
.star-input button{padding:2px;color:#D8E0EF}
.star-input button.on{color:#F5B301}
.star-input svg{width:26px;height:26px}
.mastery-pick{display:flex;gap:8px;flex-wrap:wrap}
.mastery-pick button{border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-2);background:#fff}
.mastery-pick button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:rgba(24,32,48,.94);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:86vw;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 家长视角 ============ */
.parent-shell{max-width:720px;margin:0 auto}
.parent-hero{background:linear-gradient(135deg,#2F6BFF,#5C8CFF);color:#fff;border-radius:20px;padding:26px;box-shadow:0 16px 34px rgba(47,107,255,.28);position:relative;overflow:hidden}
.parent-hero::after{content:"";position:absolute;right:-46px;top:-46px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.parent-hero h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.parent-hero p{font-size:13px;opacity:.92;margin-top:6px;position:relative;z-index:1}
.parent-hero .ph-stats{display:flex;gap:22px;margin-top:18px;position:relative;z-index:1}
.parent-hero .phs b{font-size:24px;font-weight:800;display:block}
.parent-hero .phs span{font-size:12px;opacity:.9}

/* ============ 响应式：三端统一桌面布局（侧边栏+主内容） ============ */
@media(max-width:1023px){
  :root{--sidebar-w:200px}
  .sidebar{padding:16px 10px}
  .brand{padding:4px 6px 14px;gap:10px}
  .brand-logo{width:44px;height:44px}
  .brand-name{font-size:13px}
  .nav-item{padding:9px 11px;font-size:13.5px;gap:10px}
  .nav-item .nav-ic{width:30px;height:30px}
  .nav-group{font-size:10px;padding:14px 11px 4px}
  .main{padding:18px 18px 36px}
  .page-title h1{font-size:20px}
}
@media(max-width:768px){
  .layout{display:block}
  .menu-toggle{display:flex}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:250px;z-index:60;
    transform:translateX(-105%);transition:transform .3s cubic-bezier(.4,0,.2,1);

function mondayOf(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const day = (x.getDay() + 6) % 7;

  return x;
}

  { key:'shuxue', name:'数学', cls:'sub-shuxue', color:'#2F6BFF' },

  { key:'kexue', name:'科学', cls:'sub-kexue', color:'#7048E8' },
  { key:'other', name:'其他', cls:'sub-other', color:'#5A6572' }
];
const subjectOf = key => SUBJECTS.find(s => s.key === key) || SUBJECTS[4];
const MASTERY_TXT = { 1:'需加强', 2:'需加强', 3:'一般', 4:'掌握较好', 5:'掌握很好' };
const AVATAR_COLORS = ['#2F6BFF','#0CA678','#F08C00','#7048E8','#E5484D','#0B7285','#C2255C','#5C7CFA'];

/* ============================================================
   状态与存储
   ============================================================ */
const STORE_KEY = 'hw-workbench-v1';
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.students) && Array.isArray(d.homeworks)) return d; }
  }catch(e){}
  return { students:[], homeworks:[], comment:{} };
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast('存储空间不足，请清理照片'); } }

/* ============================================================
   数据操作
   ============================================================ */
function getStudent(id){ return state.students.find(s => s.id === id); }
function addStudent(data){
  const s = { id:uid(), name:data.name.trim(), grade:data.grade.trim(), className:data.className.trim(), avatar:AVATAR_COLORS[state.students.length % AVATAR_COLORS.length], createdAt:Date.now() };
  state.students.push(s); save(); return s;
}
function updateStudent(id, patch){ const s = getStudent(id); if(s){ Object.assign(s, patch); save(); } }
function deleteStudent(id){
  state.students = state.students.filter(s => s.id !== id);
  state.homeworks = state.homeworks.filter(h => h.studentId !== id);
  save();
}
function addHomework(data){
  const h = { id:uid(), studentId:data.studentId, subject:data.subject, content:data.content.trim(), knowledge:(data.knowledge||'').trim(), assignedDate:data.assignedDate, dueDate:data.dueDate || data.assignedDate, status:data.status || 'pending', completedAt:data.completedAt || null, mastery:data.mastery || null, feedback:data.feedback || '', photo:data.photo || null, note:(data.note||'').trim(), wrong:data.wrong || false, wrongNote:(data.wrongNote||'').trim(), reviewed:data.reviewed || false, createdAt:Date.now() };
  state.homeworks.push(h); save(); return h;
}
function toggleHomework(id){
  const h = state.homeworks.find(x => x.id === id);
  if(!h) return;
  if(h.status === 'pending'){ h.status = 'done'; h.completedAt = new Date().toISOString(); }
  else { h.status = 'pending'; h.completedAt = null; }
  save();
}
function setMastery(id, val){ const h = state.homeworks.find(x => x.id === id); if(h){ h.mastery = val; save(); } }
function setFeedback(id, val){ const h = state.homeworks.find(x => x.id === id); if(h){ h.feedback = val; save(); } }
function toggleWrong(id){ const h = state.homeworks.find(x => x.id === id); if(h){ h.wrong = !h.wrong; if(!h.wrong){ h.wrongNote = ''; } save(); } }
function setWrongNote(id, val){ const h = state.homeworks.find(x => x.id === id); if(h){ h.wrongNote = val; save(); } }
function markReviewed(id){ const h = state.homeworks.find(x => x.id === id); if(h){ h.reviewed = !h.reviewed; save(); } }
function setPhoto(id, dataUrl){ const h = state.homeworks.find(x => x.id === id); if(h){ h.photo = dataUrl; save(); } }
function deleteHomework(id){ state.homeworks = state.homeworks.filter(h => h.id !== id); save(); }
function updateHomework(id, patch){ const h = state.homeworks.find(x => x.id === id); if(h){ Object.assign(h, patch); save(); } }
function setStudentComment(id, txt){ state.comment[id] = txt; save(); }
function getComment(id){ return state.comment[id] || ''; }

/* ============================================================
   统计
   ============================================================ */
function weekHomeworks(studentId, start){
  return state.homeworks
    .filter(h => h.studentId === studentId && inWeek(h.assignedDate, start))
    .sort((a,b) => a.assignedDate < b.assignedDate ? 1 : (a.assignedDate > b.assignedDate ? -1 : 0));
}
function studentWeekStats(studentId, start){
  const list = weekHomeworks(studentId, start);
  const total = list.length;
  const done = list.filter(h => h.status === 'done').length;
  const rate = total ? done / total : 0;
  const onTime = list.filter(h => h.status === 'done' && h.completedAt && h.completedAt.slice(0,10) <= (h.dueDate || h.assignedDate)).length;
  const onTimeRate = done ? onTime / done : 0;
  const masteryArr = list.filter(h => h.mastery).map(h => h.mastery);
  const masteryAvg = masteryArr.length ? masteryArr.reduce((a,b)=>a+b,0) / masteryArr.length : null;
  const wrongList = list.filter(h => h.wrong);
  const wrongCount = wrongList.length;
  const wrongReviewed = wrongList.filter(h => h.reviewed).length;
  const perSubject = {};
  list.forEach(h => {
    if(!perSubject[h.subject]) perSubject[h.subject] = { key:h.subject, total:0, done:0, mastery:[], wrong:0 };
    const p = perSubject[h.subject];
    p.total++; if(h.status==='done') p.done++;
    if(h.mastery) p.mastery.push(h.mastery);
    if(h.wrong) p.wrong++;
  });
  Object.values(perSubject).forEach(p => { p.rate = p.total ? p.done/p.total : 0; p.masteryAvg = p.mastery.length ? p.mastery.reduce((a,b)=>a+b,0)/p.mastery.length : null; });
  return { list, total, done, rate, onTimeRate, masteryAvg, perSubject:Object.values(perSubject), wrongList, wrongCount, wrongReviewed };
}
function todayHomeworks(){
  return state.homeworks
    .filter(h => h.assignedDate === todayKey())
    .sort((a,b) => a.status === b.status ? 0 : (a.status === 'pending' ? -1 : 1));
}
function allWeekStats(start){
  return state.students.map(s => ({ student:s, stats:studentWeekStats(s.id, start) }));
}
function weekHomeworksAll(start){
  return state.homeworks.filter(h => inWeek(h.assignedDate, start));
}

/* ============================================================
   分析引擎（规则化智能分析，基于真实数据计算）
   ============================================================ */
const DOMAIN_MAP = {
  yuwen:['识字','拼音','阅读','写作','古诗','字词','词语搭配'],
  shuxue:['计算','口算','应用题','几何','单位换算','四则运算','竖式计算'],
  yingyu:['单词','句型','听力','阅读','语法','拼写','对话'],
  kexue:['观察','实验','常识','生活现象','探究','记录'],
  other:['练习','拓展','背诵','抄写','复习']
};
function generateReport(studentId, start){
  const st = getStudent(studentId);
  const stats = studentWeekStats(studentId, start);
  const { total, done, rate, onTimeRate, masteryAvg, perSubject } = stats;
  const score = Math.round(Math.min(100, rate*55 + onTimeRate*25 + (masteryAvg ? masteryAvg/5*20 : 12)));
  const grade = score >= 92 ? 'A+' : score >= 85 ? 'A' : score >= 75 ? 'B' : score >= 60 ? 'C' : 'D';
  const gradeTxt = { 'A+':'优秀','A':'良好','B':'中等','C':'需努力','D':'待加油' }[grade];

  // 学科强弱
  const weak = perSubject.filter(p => p.rate < 0.6 || (p.masteryAvg !== null && p.masteryAvg < 3));
  const strong = perSubject.filter(p => p.rate >= 0.8 && (p.masteryAvg === null || p.masteryAvg >= 3.5));

  // 知识点聚合
  const points = {};
  stats.list.forEach(h => {
    const tags = (h.knowledge || '').split(/[,，、;；]/).map(t => t.trim()).filter(Boolean);
    const useTags = tags.length ? tags : DOMAIN_MAP[h.subject] || [];
    useTags.forEach(t => {
      if(!points[t]) points[t] = { name:t, count:0, mastery:[] };
      points[t].count++;
      if(h.mastery) points[t].mastery.push(h.mastery);
    });
  });
  const pointList = Object.values(points).map(p => ({ name:p.name, count:p.count, avg: p.mastery.length ? p.mastery.reduce((a,b)=>a+b,0)/p.mastery.length : null }));

  // 生成文字
  const strongTxt = strong.length ? strong.map(p => subjectOf(p.key).name).join('、') : '各科完成情况较为均衡';
  const weakTxt = weak.length ? weak.map(p => subjectOf(p.key).name).join('、') : null;
  const habits = [];
  if(onTimeRate >= 0.9) habits.push('作业完成及时，能够按计划完成，时间管理习惯良好');
  else if(onTimeRate >= 0.6) habits.push('大部分作业能按时完成，偶尔有拖延，需继续巩固时间观念');
  else habits.push('作业完成及时性有待提高，存在部分未按时完成的情况');
  if(masteryAvg !== null){
    if(masteryAvg >= 4) habits.push('整体知识掌握程度较好，作业质量稳定');
    else if(masteryAvg >= 3) habits.push('知识掌握程度中等，仍有提升空间');
    else habits.push('部分知识点掌握不够扎实，建议加强练习巩固');
  } else {
    habits.push('建议老师后续为作业标注掌握程度，可生成更精准的知识点分析');
  }
  const weakAdvice = weak.length ? '重点关注 ' + weakTxt + ' 的作业，及时查漏补缺，可适当增加针对性练习。' : '保持各科均衡推进，可适当增加拓展性、开放性作业提升学习深度。';
  const pointAdvice = pointList.filter(p => p.avg !== null && p.avg < 3).length
    ? '以下知识点掌握偏弱，建议专项巩固：' + pointList.filter(p => p.avg !== null && p.avg < 3).map(p => p.name).join('、') + '。'
    : '知识点整体掌握平稳，建议保持练习节奏，通过错题复盘持续巩固。';

  return {
    student:st, stats, score, grade, gradeTxt, weak, strong, strongTxt, weakTxt,
    pointList, habits, weakAdvice, pointAdvice, weekLabel:weekLabel(start), start
  };
}

function parseHash(){
  const raw = location.hash.replace(/^#/, '') || 'home';
  const [path, qs] = raw.split('?');
  const query = {};
  if(qs) qs.split('&').forEach(kv => { const [k,v] = kv.split('='); if(k) query[decodeURIComponent(k)] = decodeURIComponent(v||''); });
  return { path, query };
}
let current = parseHash();
function navigate(path, query){
  let q = '';
  if(query){ q = '?' + Object.keys(query).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(query[k])).join('&'); }
  location.hash = path + q;
}
window.addEventListener('hashchange', () => { current = parseHash(); render(); });

/* ============================================================
   组件
   ============================================================ */
function subjectTag(key){ const s = subjectOf(key); return '<span class="sub ' + s.cls + '"><span class="dot"></span>' + s.name + '</span>'; }
function ring(pct, size, stroke, color){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, Math.max(0, pct)));
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '"/><circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')" style="transition:stroke-dashoffset .5s ease"/></svg>';
}
function avatarHtml(s, size){
  size = size || 48;
  return '<div class="avatar" style="background:' + s.avatar + ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.42) + 'px">' + esc(s.name.slice(0,1)) + '</div>';
}
function stars(n, max){
  max = max || 5; let h = '<span class="mastery-dots">';
  for(let i=1;i<=max;i++){ h += i <= n ? IC.star : IC.starOff; }
  return h + '</span>';
}
function photoThumb(h){
  if(!h.photo) return '';
  return '<img class="photo-thumb" src="' + h.photo + '" alt="作业照片" onclick="viewPhoto(\'' + h.id + '\')">';
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(()=>toast('已复制'), ()=>fallbackCopy(txt)); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败'); }
  document.body.removeChild(ta);
}

let photoTargetId = null;
function uploadPhoto(id){ photoTargetId = id; $('#file-input').click(); }
function viewPhoto(id){ const h = state.homeworks.find(x => x.id === id); if(!h || !h.photo) return; viewImage(h.photo); }
let imageMask = null;
function viewImage(src){
  imageMask = document.createElement('div');
  imageMask.style.cssText = 'position:fixed;inset:0;background:rgba(10,16,28,.86);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  const img = document.createElement('img');
  img.src = src; img.style.cssText = 'max-width:100%;max-height:100%;border-radius:12px;object-fit:contain';
  imageMask.appendChild(img);
  imageMask.addEventListener('click', () => { imageMask.remove(); imageMask = null; });
  document.body.appendChild(imageMask);
}
$('#file-input').addEventListener('change', function(){
  const f = this.files && this.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast('请选择图片'); this.value=''; return; }
  compressImage(f, dataUrl => {
    if(photoTargetId){ setPhoto(photoTargetId, dataUrl); photoTargetId = null; toast('作业照片已上传'); render(); }
    this.value = '';
  });
});
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height; const max = 1080;
      if(w > max || h > max){ const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => cb(e.target.result);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  if(!analysisStudentId || !getStudent(analysisStudentId)) analysisStudentId = state.students[0].id;

function renderParent(){
  const id = current.query.id;
  const s = getStudent(id);
  if(!s){ $('#view-root').innerHTML = '<div class="card">' + emptyHtml('eye', '未找到学生', '家长链接无效，请联系托管老师获取正确链接') + '</div>'; return; }
  const start = mondayOf(new Date());
  const st = studentWeekStats(s.id, start);
  const pct = Math.round(st.rate*100);

  const grouped = {};
  st.list.forEach(h => { const d = h.assignedDate; if(!grouped[d]) grouped[d] = []; grouped[d].push(h); });
  const dayKeys = Object.keys(grouped).sort((a,b) => a < b ? 1 : (a > b ? -1 : 0));
  let listHtml = '';
  if(dayKeys.length){
    listHtml = dayKeys.map(d => {
      const items = grouped[d].map(h => {
        const done = h.status === 'done';
        return '<div class="todo-item ' + (done?'done':'') + '" style="cursor:default">' +
          '<div class="check-btn" style="border-width:2px;cursor:default">' + IC.check + '</div>' +
          '<div class="todo-main"><div class="tm">' + subjectTag(h.subject) +
            (done ? '<span class="tag" style="font-size:11px;font-weight:700;color:var(--success);background:var(--success-soft);padding:2px 8px;border-radius:20px">已完成</span>' : '<span class="tag" style="font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:20px">进行中</span>') +
          '</div><div class="ct">' + esc(h.content) + '</div>' +
          '<div class="meta">' + (h.knowledge ? '知识点：' + esc(h.knowledge) : '') + (h.feedback ? ' · <span style="color:var(--primary)">老师点评：' + esc(h.feedback) + '</span>' : '') + '</div>' +
          '</div><div class="todo-ops">' + photoThumb(h) + '</div></div>';
      }).join('');
      return '<div style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-weight:700;font-size:14px">' + fmtShort(d) + '</span><span style="font-size:11.5px;color:var(--ink-3)">' + items.length + ' 项</span></div><div class="todo-list">' + items + '</div></div>';
    }).join('');
  } else {
    listHtml = emptyHtml('doc', '本周暂无作业记录', '老师登记作业后即可在此查看');
  }

  const comment = getComment(id);
  const report = generateReport(id, start);

  $('#view-root').innerHTML =
    '<div class="parent-shell">' +
      '<div class="parent-hero">' +
        '<h1>' + avatarHtml(s, 40) + esc(s.name) + ' 的作业情况</h1>' +
        '<p>' + report.weekLabel + ' · 本周作业完成情况 · 托管老师同步</p>' +
        '<div class="ph-stats">' +
          '<div class="phs"><b>' + st.done + '/' + st.total + '</b><span>完成作业</span></div>' +
          '<div class="phs"><b>' + pct + '%</b><span>本周完成率</span></div>' +
          '<div class="phs"><b>' + report.grade + '</b><span>综合评级</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="report-section"><h3><span class="ico ic-blue">' + IC.chart + '</span>本周完成情况</h3>' +
        '<div class="kv">' +
          kv('作业总数', st.total + ' 项') +
          kv('已完成', st.done + ' 项') +
          kv('完成率', pct + '%') +
          kv('按时完成', Math.round(st.onTimeRate*100) + '%') +
        '</div></div>' +
      '<div class="card"><div class="card-head"><h3>每日作业明细</h3><span class="hint">点击照片可放大查看</span></div>' + listHtml + '</div>' +
      (comment ? '<div class="report-section"><h3><span class="ico ic-green">' + IC.edit + '</span>老师评语</h3><div style="font-size:14.5px">' + esc(comment) + '</div></div>' : '') +
      '<div class="report-section"><h3><span class="ico ic-purple">' + IC.spark + '</span>分析摘要</h3>' +
        '<div class="hint" style="color:var(--ink-3);font-size:12.5px;margin-bottom:8px">' + report.weakAdvice + '</div>' +
        '<div class="advice" style="border-left-color:var(--primary)">' + IC.check + '<div>' + report.habits[0] + '</div></div>' +
      '</div>' +
      '<div class="hint no-print" style="text-align:center;padding:16px 0;color:var(--ink-3)">' +
        '<button class="btn btn-ghost btn-sm" onclick="navigate(\'student\',{id:\'' + s.id + '\'})">返回老师工作台</button>' +
      '</div>' +
    '</div>';
}

/* ============================================================
   备份 / 恢复
   ============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(state)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '作业工作台备份-' + todayKey() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('备份文件已导出');
}
$('#btn-export').addEventListener('click', exportData);
$('#btn-import').addEventListener('click', () => $('#json-input').click());
$('#json-input').addEventListener('change', function(){
  const f = this.files && this.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.students) || !Array.isArray(d.homeworks)) throw new Error('bad');
      state = { students:d.students, homeworks:d.homeworks, comment:d.comment || {} };
      save(); toast('数据已恢复'); render();
    }catch(e){ toast('备份文件格式不正确'); }
    this.value = '';
  };
  r.readAsText(f);
});

/* ============================================================
   功能：一键生成每日反馈
   ============================================================ */
function openDailyFeedback(studentId){
  const s = getStudent(studentId);
  if(!s) return;
  const today = todayKey();
  const todayList = state.homeworks.filter(h => h.studentId === studentId && h.assignedDate === today);
  const doneList = todayList.filter(h => h.status === 'done');
  const pendingList = todayList.filter(h => h.status === 'pending');
  const wrongList = todayList.filter(h => h.wrong);
  const now = new Date();
  const weekday = ['日','一','二','三','四','五','六'][now.getDay()];
  const dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 周' + weekday;

  let lines = [];
  lines.push('【' + s.name + ' 每日作业反馈】');
  lines.push('📅 ' + dateStr);
  lines.push('');
  lines.push('✅ 今日完成情况：' + doneList.length + '/' + todayList.length + ' 项');
  if(doneList.length){
    lines.push('');
    lines.push('已完成作业：');
    doneList.forEach((h,i) => {
      const sub = subjectOf(h.subject).name;
      const mastery = h.mastery ? '（掌握：' + MASTERY_TXT[h.mastery] + '）' : '';
      lines.push((i+1) + '. [' + sub + '] ' + h.content + mastery);
    });
  }
  if(pendingList.length){
    lines.push('');
    lines.push('⏳ 待完成作业：');
    pendingList.forEach((h,i) => {
      lines.push((i+1) + '. [' + subjectOf(h.subject).name + '] ' + h.content);
    });
  }
  if(wrongList.length){
    lines.push('');
    lines.push('❌ 需订正：');
    wrongList.forEach((h,i) => {
      lines.push((i+1) + '. [' + subjectOf(h.subject).name + '] ' + h.content + (h.wrongNote ? '（' + h.wrongNote + '）' : ''));
    });
  }
  const knowledgeSet = new Set();
  doneList.forEach(h => { if(h.knowledge) h.knowledge.split(/[,，、;；]/).forEach(t => t.trim() && knowledgeSet.add(t.trim())); });
  if(knowledgeSet.size){
    lines.push('');
    lines.push('📚 今日涉及知识点：' + Array.from(knowledgeSet).join('、'));
  }
  const feedbacks = doneList.filter(h => h.feedback).map(h => h.feedback);
  if(feedbacks.length){
    lines.push('');
    lines.push('💬 老师点评：');
    feedbacks.forEach((f,i) => lines.push((i+1) + '. ' + f));
  }
  lines.push('');
  if(pendingList.length){
    lines.push('📌 温馨提示：还有 ' + pendingList.length + ' 项作业待完成，请家长协助督促孩子尽快完成。');
  } else if(wrongList.length){
    lines.push('📌 温馨提示：今日有 ' + wrongList.length + ' 项作业存在错误，请孩子及时订正，家长可协助检查。');
  } else {
    lines.push('🎉 今日作业全部完成，表现很棒！请继续保持！');
  }
  lines.push('');
  lines.push('—— ' + '刘老师高效学习托管工作室');

  const text = lines.join('\n');
  openModal(
    '<div class="modal-head"><h3>每日反馈 · ' + esc(s.name) + '</h3><button class="modal-close" onclick="closeModal()">' + IC.close + '</button></div>' +
    '<div class="hint" style="font-size:12.5px;color:var(--ink-3);margin-bottom:10px">已根据今日作业数据自动生成，可直接复制发送给家长</div>' +
    '<textarea class="feedback-text" id="daily-fb-text" readonly>' + esc(text) + '</textarea>' +
    '<div class="feedback-actions">' +
      '<button class="btn btn-primary" style="flex:1" onclick="copyText(document.getElementById(\'daily-fb-text\').value)">' + IC.doc + ' 复制全部内容</button>' +
      '<button class="btn btn-ghost" onclick="closeModal()">关闭</button>' +
    '</div>'
  );
}

/* ============================================================
   功能：知识点热力图（生成HTML）
   ============================================================ */
function heatmapHtml(pointList){
  if(!pointList.length) return '<div class="hint" style="color:var(--ink-3);font-size:13px;padding:10px 0">暂无知识点数据，登记作业时填写"涉及知识点"即可生成热力图</div>';
  const legend = '<div class="heatmap-legend">' +
    '<span class="lg"><span class="sw" style="background:#20B571"></span>掌握很好(≥4.5)</span>' +
    '<span class="lg"><span class="sw" style="background:#51CF66"></span>掌握良好(4-4.5)</span>' +
    '<span class="lg"><span class="sw" style="background:#FFD43B"></span>基本掌握(3-4)</span>' +
    '<span class="lg"><span class="sw" style="background:#FF922B"></span>需加强(2-3)</span>' +
    '<span class="lg"><span class="sw" style="background:#FA5252"></span>薄弱(<2)</span>' +
    '<span class="lg"><span class="sw" style="background:var(--surface-2);border:1px solid var(--line)"></span>待评估</span>' +
  '</div>';
  const cells = pointList.map(p => {
    let cls = 'heat-none', label = '待评估';
    if(p.avg !== null){
      if(p.avg >= 4.5){ cls = 'heat-strong'; label = '掌握很好'; }
      else if(p.avg >= 4){ cls = 'heat-good'; label = '掌握良好'; }
      else if(p.avg >= 3){ cls = 'heat-mid'; label = '基本掌握'; }
      else if(p.avg >= 2){ cls = 'heat-weak'; label = '需加强'; }
      else { cls = 'heat-bad'; label = '薄弱'; }
    }
    const avgText = p.avg !== null ? p.avg.toFixed(1) + '/5' : '—';
    return '<div class="heat-cell ' + cls + '"><div class="hn">' + esc(p.name) + '</div><div class="hv">' + label + ' · ' + avgText + '</div><div class="hc">出现 ' + p.count + ' 次</div></div>';
  }).join('');
  return legend + '<div class="heatmap-grid">' + cells + '</div>';
}

/* ============================================================
   功能：AI智能建议（规则化引擎）
   ============================================================ */
function aiSuggestions(report){
  const { stats, weak, strong, pointList, weakAdvice, pointAdvice } = report;
  const suggestions = [];
  // 知识点专项建议
  const weakPoints = pointList.filter(p => p.avg !== null && p.avg < 3);
  if(weakPoints.length){
    suggestions.push({
      type:'knowledge', icon:'📌', title:'知识点专项巩固',
      color:'var(--danger)',
      items: weakPoints.map(p => '「' + p.name + '」当前掌握度 ' + p.avg.toFixed(1) + '/5，建议：每天安排 10-15 分钟专项练习，先回顾课本例题，再做 3-5 道同类题，连续练习 3 天后重新测评。')
    });
  }
  // 薄弱学科建议
  if(weak.length){
    suggestions.push({
      type:'subject', icon:'📚', title:'薄弱学科提升',
      color:'var(--accent)',
      items: weak.map(p => {
        const sub = subjectOf(p.key);
        const rate = Math.round(p.rate*100);
        return sub.name + '完成率 ' + rate + '%，建议：① 每天优先安排该科目作业；② 建立错题本，每周复盘一次；③ 遇到不懂的知识点及时请教老师，不要积压。';
      })
    });
  }
  // 学习习惯建议
  if(stats.onTimeRate < 0.7){
    suggestions.push({
      type:'habit', icon:'⏰', title:'学习习惯优化',
      color:'var(--primary)',
      items: ['作业按时完成率 ' + Math.round(stats.onTimeRate*100) + '%，建议使用番茄工作法：每 25 分钟专注学习 + 5 分钟休息，每天固定时间段完成作业，培养时间管理意识。']
    });
  }
  // 优势保持建议
  if(strong.length){
    suggestions.push({
      type:'strength', icon:'🌟', title:'优势学科拓展',
      color:'var(--success)',
      items: strong.map(p => subjectOf(p.key).name + '表现优秀，建议适当增加拓展性、开放性作业，挑战更高难度题目，保持学习兴趣和优势。')
    });
  }
  // 综合建议
  suggestions.push({
    type:'general', icon:'💡', title:'综合学习建议',
    color:'#7048E8',
    items: [
      weakPoints.length ? '本周重点攻克 ' + weakPoints.slice(0,3).map(p=>p.name).join('、') + '，建议家长协同督促。' : '本周知识点掌握整体平稳，建议保持练习节奏，通过错题复盘持续巩固。',
      '建议每周日晚上进行一次周复盘，整理本周错题，规划下周学习重点。'
    ]
  });
  return suggestions;
}

/* ============================================================
   视图：错题本
   ============================================================ */
let mistakeFilter = { student:'all', subject:'all', showReviewed:true };
function renderMistakes(){
  const allWrong = state.homeworks.filter(h => h.wrong);
  const filtered = allWrong.filter(h => {
    if(mistakeFilter.student !== 'all' && h.studentId !== mistakeFilter.student) return false;
    if(mistakeFilter.subject !== 'all' && h.subject !== mistakeFilter.subject) return false;
    if(!mistakeFilter.showReviewed && h.reviewed) return false;
    return true;
  });
  const total = allWrong.length;
  const reviewed = allWrong.filter(h => h.reviewed).length;
  const pending = total - reviewed;
  const bySubject = {};
  allWrong.forEach(h => { if(!bySubject[h.subject]) bySubject[h.subject] = 0; bySubject[h.subject]++; });
  const topSubject = Object.entries(bySubject).sort((a,b)=>b[1]-a[1])[0];

  const studentOpts = '<option value="all">全部学生</option>' + state.students.map(s => '<option value="' + s.id + '"' + (mistakeFilter.student===s.id?' selected':'') + '>' + esc(s.name) + '</option>').join('');
  const subjectOpts = '<option value="all">全部科目</option>' + SUBJECTS.map(s => '<option value="' + s.key + '"' + (mistakeFilter.subject===s.key?' selected':'') + '>' + s.name + '</option>').join('');

  let listHtml = '';
  if(filtered.length){
    listHtml = filtered.map(h => {
      const s = getStudent(h.studentId);
      const sub = subjectOf(h.subject);
      return '<div class="mistake-item ' + (h.reviewed?'reviewed':'') + '">' +
        '<div class="mi-left" style="background:' + (s?s.avatar:'#999') + '">' + (s?s.name.slice(0,1):'?') + '</div>' +
        '<div class="mi-main">' +
          '<div class="mi-title">' + (s?'<b>' + esc(s.name) + '</b>':'') + subjectTag(h.subject) +
            (h.reviewed ? '<span class="tag" style="font-size:11px;color:var(--success);background:var(--success-soft)">已复习</span>' : '<span class="tag" style="font-size:11px;color:var(--danger);background:var(--danger-soft)">待复习</span>') +
          '</div>' +
          '<div class="mi-content">' + esc(h.content) + '</div>' +
          (h.wrongNote ? '<div class="mi-content" style="color:var(--danger);font-size:12.5px">错误说明：' + esc(h.wrongNote) + '</div>' : '') +
          '<div class="mi-meta">' +
            (h.knowledge ? '<span>知识点：' + esc(h.knowledge) + '</span>' : '') +
            '<span>布置：' + fmtShort(h.assignedDate) + '</span>' +
            (h.mastery ? '<span>掌握：' + MASTERY_TXT[h.mastery] + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="mi-ops">' +
          '<button class="icon-btn" title="' + (h.reviewed?'取消复习标记':'标记已复习') + '" onclick="markReviewed(\'' + h.id + '\');renderMistakes()">' + IC.check + '</button>' +
          '<button class="icon-btn" title="查看学生详情" onclick="navigate(\'student\',{id:\'' + h.studentId + '\'})">' + IC.eye + '</button>' +
          '<button class="icon-btn" title="取消错误标记" onclick="toggleWrong(\'' + h.id + '\');renderMistakes()">' + IC.trash + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } else {
    listHtml = emptyHtml('trash', total ? '没有符合筛选条件的错题' : '还没有错题记录', total ? '调整筛选条件试试' : '在学生详情页点击作业的垃圾桶图标标记错误，错题会自动收录到这里');
  }

  $('#view-root').innerHTML =
    '<div class="page-title"><div><h1>错题本</h1><div class="sub">自动收录标记错误的作业，支持复习管理</div></div>' +
      '<div class="actions"><button class="btn btn-ghost btn-sm" onclick="mistakeFilter.showReviewed=!mistakeFilter.showReviewed;renderMistakes()">' + (mistakeFilter.showReviewed?'隐藏已复习':'显示全部') + '</button></div></div>' +
    '<div class="mistake-stat-grid">' +
      '<div class="mistake-stat"><b style="color:var(--danger)">' + total + '</b><span>错题总数</span></div>' +
      '<div class="mistake-stat"><b style="color:var(--accent)">' + pending + '</b><span>待复习</span></div>' +
      '<div class="mistake-stat"><b style="color:var(--success)">' + reviewed + '</b><span>已复习</span></div>' +
      '<div class="mistake-stat"><b style="color:var(--primary)">' + (topSubject?subjectOf(topSubject[0]).name:'—') + '</b><span>错题最多科目</span></div>' +
    '</div>' +
    '<div class="mistake-filter">' +
      '<select onchange="mistakeFilter.student=this.value;renderMistakes()">' + studentOpts + '</select>' +
      '<select onchange="mistakeFilter.subject=this.value;renderMistakes()">' + subjectOpts + '</select>' +
      '<span class="hint" style="font-size:12.5px">共 ' + filtered.length + ' 条记录</span>' +
    '</div>' +
    listHtml;
}

  const start = mondayOf(new Date()); start.setDate(start.getDate() + heatmapOffset*7);

  const studentOpts = state.students.map(x => '<option value="' + x.id + '"' + (x.id===heatmapStudentId?' selected':'') + '>' + esc(x.name) + '（' + esc(x.grade + x.className) + '）</option>').join('');

  // 按掌握度排序
  const sortedPoints = [...r.pointList].sort((a,b) => {

      '<b style="white-space:nowrap;font-size:13px">' + weekLabel(start) + '</b>' +

/* ============================================================
   实时时钟
   ============================================================ */
let clockTimer = null;
function tickClock(){
  const el = $('#lc-time');
  const dateEl = $('#lc-date');
  if(!el) return; // 不在首页时不更新
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  el.innerHTML = h + ':' + m + '<span class="sec">' + s + '</span>';
  const weekday = ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  dateEl.textContent = (now.getMonth()+1) + '月' + now.getDate() + '日 ' + weekday;
}
function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
}
